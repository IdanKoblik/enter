name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Build binaries
        run: make all

      - name: Rename binaries
        run: |
          mv enter-linux speedtest-linux
          mv enter-windows.exe speedtest-windows.exe
          mv enter-macos speedtest-macos

      - name: Create Tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "v$(git rev-parse --short HEAD)" -m "Release $(git rev-parse --short HEAD)"
          git push origin "v$(git rev-parse --short HEAD)"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            enter-linux
            enter-windows.exe
            enter-macos
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
