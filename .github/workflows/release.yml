name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Build binaries
        run: make all

      - name: Rename binaries
        run: |
          mv enter-linux speedtest-linux
          mv enter-windows.exe speedtest-windows.exe
          mv enter-macos speedtest-macos

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            enter-linux
            enter-windows.exe
            enter-macos
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
